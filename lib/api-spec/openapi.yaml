openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /images:
    post:
      operationId: uploadImage
      summary: Upload a cover image (verified owner only)
      description: Accepts PNG, JPEG, or WebP bytes up to 5 MiB. Uploaded images remain private until referenced by published content.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored image; save the returned URL with the content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadedImage" }
        "400": { description: Invalid image }
        "401": { description: Sign-in required }
        "403": { description: Owner access required }
        "413": { description: Image exceeds 5 MiB }
        "415": { description: Unsupported image format }
  /images/{filename}:
    get:
      operationId: getUploadedImage
      summary: Read a published cover image or an owner's private upload
      parameters:
        - { name: filename, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Stored image
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: Image not found or not public }
  /profile:
    get:
      operationId: getProfile
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
    put:
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Profile" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
  /admin/session:
    get:
      operationId: getAdminSession
      responses:
        "200":
          description: Owner permission state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
  /content:
    get:
      operationId: listContent
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [project, blog] } }
        - { name: admin, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Content list (published only unless authorized admin)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Content" } }
    post:
      operationId: createContent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Content" }
  /content/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      operationId: getContent
      responses:
        "200":
          description: Published content or owner's draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Content" }
    put:
      operationId: updateContent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Content" }
    delete:
      operationId: deleteContent
      responses:
        "204": { description: Deleted }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    UploadedImage:
      type: object
      required: [url]
      properties:
        url: { type: string, description: Same-origin image path under /api/images/ }
    AdminSession:
      type: object
      required: [signedIn, isAdmin, ownerConfigured]
      properties:
        signedIn: { type: boolean }
        isAdmin: { type: boolean }
        ownerConfigured: { type: boolean }
    Profile:
      type: object
      required: [fullName, headline, intro, about, focusTitle, focusDescription, email, githubUrl, linkedinUrl, resumeUrl, portfolioUrl]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        headline: { type: string, minLength: 1, maxLength: 120 }
        intro: { type: string, maxLength: 1000 }
        about: { type: string, maxLength: 10000 }
        focusTitle: { type: string, maxLength: 200 }
        focusDescription: { type: string, maxLength: 3000 }
        email: { type: string, maxLength: 254 }
        githubUrl: { type: string, maxLength: 2000 }
        linkedinUrl: { type: string, maxLength: 2000 }
        resumeUrl: { type: string, maxLength: 2000 }
        portfolioUrl: { type: string, maxLength: 2000 }
    ContentInput:
      type: object
      required: [kind, title, slug, summary, body, tags, imageUrl, liveUrl, sourceUrl, published, featured]
      properties:
        kind: { type: string, enum: [project, blog] }
        title: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, minLength: 1, maxLength: 180, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        summary: { type: string, maxLength: 1000 }
        body: { type: string, maxLength: 100000 }
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 60 } }
        imageUrl: { type: string, maxLength: 2000, description: HTTPS image URL or a server-issued /api/images/ path }
        liveUrl: { type: string, maxLength: 2000 }
        sourceUrl: { type: string, maxLength: 2000 }
        published: { type: boolean }
        featured: { type: boolean }
    Content:
      allOf:
        - { $ref: "#/components/schemas/ContentInput" }
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: integer }
            createdAt: { type: string }
            updatedAt: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

