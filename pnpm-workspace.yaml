# Require a one-day release age for dependencies.
minimumReleaseAge: 1440

packages:
  - artifacts/portfolio
  - artifacts/api-server
  - lib/*

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  lucide-react: ^0.545.0
  # Keep React and React DOM aligned.
  react: 19.1.4
  # Keep React and React DOM aligned.
  react-dom: 19.1.4
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  "proxy-addr@^2": "^2.0.8"
  "source-map-js@^1": "^1.2.2"
  "fast-uri@^3": "^3.1.8"
  "brace-expansion@^5": "^5.0.12"
  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.28.2"
  # orval pins js-yaml to an exact version older than the CVE fix (>=4.3.2)
  js-yaml: '4.3.2'
